<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Jev Agent Router</title>
  <desc id="description">Benchmarking keyword, LLM and Jev routing on accuracy and latency.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140d2a"/>
      <stop offset="0.56" stop-color="#2e1f63"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".25"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a0618" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1040" cy="60" r="230" fill="url(#glow)"/>
  <g opacity=".22" fill="none" stroke="#c4b5fd" stroke-width="1.4">
    <path d="M760 150h110M870 150l70-60h120M870 150l70 0h120M870 150l70 60h120"/>
    <g fill="#c4b5fd" stroke="none"><circle cx="760" cy="150" r="6"/><circle cx="870" cy="150" r="6"/><circle cx="1060" cy="90" r="6"/><circle cx="1060" cy="150" r="6"/><circle cx="1060" cy="210" r="6"/></g>
  </g>
  <g transform="translate(74 68)" filter="url(#shadow)">
    <rect width="88" height="88" rx="22" fill="#241552" stroke="#c4b5fd" stroke-opacity=".6"/>
    <g fill="none" stroke="#c4b5fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="22" cy="44" r="6"/><circle cx="66" cy="24" r="6"/><circle cx="66" cy="44" r="6"/><circle cx="66" cy="64" r="6"/>
      <path d="M28 44h14l14-20h4M42 44h18M42 44l14 20h4"/>
    </g>
  </g>
  <text x="190" y="118" fill="#f5f3ff" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="700">Jev Agent Router</text>
  <text x="190" y="162" fill="#ddd6fe" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="24">Keyword vs LLM vs Jev: accuracy and latency, measured</text>
  <text x="74" y="250" fill="#ede9fe" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="20" opacity=".9">typed routing decisions  ·  reproducible benchmark  ·  honest about dataset size</text>
</svg>
